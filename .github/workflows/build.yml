name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    container: ghcr.io/patataofcourse/rhythmtengoku-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [rev0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare
        run: |
          cp /baserom.gba baserom.gba
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build
        run: |
          make -j$(nproc) FAIL_ON_NONMATCH=1
      
      - name: Generate report
        run: |
          python3 reportgen.py
          mv report.json ${{ matrix.version }}_report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: ${{ matrix.version }}_report.json